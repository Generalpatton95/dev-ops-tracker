# T-3 (REQ-8): every PR must pass these checks before merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # T-5 (REQ-5): a throwaway Postgres the database tests migrate and wipe on every run.
    services:
      postgres:
        # Official image, PostgreSQL 18.6, pinned by digest (multi-arch index) so a moved tag can't change it.
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: dot_test
          # Not a secret: this container is disposable, lives only for this job and holds no real data.
          POSTGRES_PASSWORD: ci-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      # Fails when the Drizzle schema has changes no committed migration covers. Offline.
      - run: pnpm run db:check
      # The database tests apply the migrations to the service above. CI is set by GitHub,
      # so they fail rather than skip if TEST_DATABASE_URL is ever missing.
      - run: pnpm run test
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-throwaway-password@localhost:5432/dot_test
      - run: pnpm run build
      # High and critical only; reviewed exceptions live in pnpm-workspace.yaml.
      - run: pnpm audit --audit-level high
